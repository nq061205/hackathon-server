server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hackathon-backend

  # ------------------------------------------------------------------
  # JPA: KHONG bao gio dung DDL — database da co san (init_basic_int.txt).
  # ddl-auto=none: Hibernate chi map entity vao bang co san, khong sua schema.
  # ------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

# ====================================================================
#  HAI KET NOI DATABASE THEO ROLE (theo ghi chu #7 trong file SQL):
#    - app_admin : SELECT/INSERT/UPDATE/DELETE teams, runs, app_users;
#                  INSERT audit_log; SELECT logs
#    - app_viewer: chi SELECT teams, runs, logs
#  Backend chon ket noi theo role cua nguoi dang nhap (JWT). Nguoi role
#  'viewer' se dung app_viewer -> khong the ghi du lieu du co loi bao mat.
#  KHONG dung role 'postgres' trong code (bo qua moi phan quyen).
# ====================================================================
datasource:
  common:
    host: ${HACKATHON_DB_HOST:localhost}
    port: ${HACKATHON_DB_PORT:5432}
    name: ${HACKATHON_DB_NAME:Hackathon}
  admin:
    user: ${HACKATHON_ADMIN_USER:app_admin}
    password: ${HACKATHON_ADMIN_PASSWORD:doi_mat_khau_1}
  viewer:
    user: ${HACKATHON_VIEWER_USER:app_viewer}
    password: ${HACKATHON_VIEWER_PASSWORD:doi_mat_khau_3}

# ====================================================================
#  JWT — doi secret truoc khi chay that. Phai du 32 byte cho HS256.
# ====================================================================
app:
  jwt:
    secret: ${APP_JWT_SECRET:doi-secret-nay-cho-that-toi-thieu-32-ky-tu-abcdefgh}
    expiration-minutes: ${APP_JWT_EXP_MINUTES:480}

logging:
  level:
    com.hackathon.backend: INFO
